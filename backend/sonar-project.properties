# CampusOverflow SonarQube 配置（Issue #32）
# 本地：docker compose -f deploy/docker-compose.yml --profile observability up -d sonarqube
# 首次访问 http://localhost:9000（admin/admin），生成 token 配到环境变量 SONAR_TOKEN

sonar.projectKey=campus-overflow
sonar.projectName=CampusOverflow
sonar.projectVersion=0.1.0-SNAPSHOT

# 源码根（相对于本文件位置）
sonar.sources=.
sonar.java.source=21
sonar.java.target=21

# 多模块：让 sonar 扫描每个模块的 main/java
sonar.modules=co-shared-kernel,co-identity,co-qa,co-reputation,co-discovery,co-bootstrap

# JaCoCo 覆盖率报告（由 mvn test jacoco:report 生成）
# 报告路径交给 sonar-maven-plugin 按模块自动发现（target/site/jacoco/jacoco.xml）；
# 显式写空值会让扫描器认为"未配置"，反而丢覆盖率。
# sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco

# 排除：测试代码、生成代码、配置文件
sonar.exclusions=**/src/test/**,**/target/generated-sources/**,**/*.yml,**/*.yaml,**/*.properties,**/flyway/**

# 质量门禁阈值（在 SonarQube 后台 Quality Gate 配置，这里写说明）：
#   Coverage on new code > 70%
#   Bugs on new code = 0
#   Vulnerabilities on new code = 0
#   Code Smells on new code < 5
# CI 里通过 -Dsonar.qualitygate.wait=true 阻塞不通过的 PR
