# CampusOverflow 持续集成流水线（对应 arc42 第 10 章适应度函数与第 7 章部署视图）
# 渐进式质量门禁（ADR-009）：Sprint0 只跑 co-shared-kernel + co-identity，集成测试不阻断合并
name: CI

on:
  push:
    branches: [main, develop, "sprint/**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # 阶段 1：编译（模块依赖不成环由 Maven 保证）
      - name: 编译
        run: mvn -B -f backend/pom.xml clean compile

      # 阶段 2：渐进式单元测试（ADR-009）。S2 起把已稳定的 Q&A 领域层纳入门禁。
      # co-qa-application / reputation / discovery 的骨架仍是 TODO，暂不纳入，
      # 等 PR #72 与对应实现合入、红测试清零后再放开，避免把全队 PR 卡红。
      - name: 单元测试（S0 + Q&A 领域层）
        run: mvn -B -f backend/pom.xml test -pl co-shared-kernel,co-identity,co-qa/co-qa-domain -am

      # 阶段 2b：Q&A 覆盖率门禁（Issue #19）
      # 父 pom 的 domain.coverage.minimum 默认 0，这里用 -D 提到 0.70；
      # PR #72 合入后模块自带 0.70 阈值，该参数不冲突。
      # 关键：jacoco:check 找不到 jacoco.exec 时会静默跳过并打印
      # "All coverage checks have been met."，所以必须额外断言 exec 确实生成，
      # 否则单测哪天被移出 CI，门禁会悄悄失效而不报错。
      - name: Q&A 领域层覆盖率门禁
        run: |
          mvn -B -f backend/pom.xml verify -pl co-qa/co-qa-domain -am -Ddomain.coverage.minimum=0.70
          test -s backend/co-qa/co-qa-domain/target/jacoco.exec || {
            echo "::error::jacoco.exec 缺失或为空：单测未真正执行，覆盖率门禁会静默跳过"
            exit 1
          }

      # 阶段 3：架构适应度函数（ArchUnit：FF-1~FF-6）
      - name: 架构约束检查
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap -am -Dtest=ArchitectureTest -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false

      # 阶段 4：集成测试（ADR-009：S0 暂不阻断合并，允许失败；S3 起开启）
      # 原来的 -Dsurefire.skip=true 是无效参数（surefire 只认 -DskipTests），
      # 该步骤其实一直在重跑全部单测，靠 continue-on-error 才没暴露红测试。
      # 改为 -Djacoco.skip=true，避免重复覆盖阶段 2b 的门禁结果；
      # 保留 continue-on-error：骨架 IT 尚未全绿，等 #34 的 Testcontainers 链路
      # 在 runner 上稳定后再改成阻断，这一步的当前状态不虚报为「已通过」。
      - name: 集成测试（允许失败）
        continue-on-error: true
        run: mvn -B -f backend/pom.xml verify -Djacoco.skip=true

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: "**/target/*-reports/*.xml"

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        working-directory: frontend
        run: npm install --no-audit --no-fund
      # #42：配了 ESLint 就必须有门禁。此前只跑 typecheck + build，
      # lint 脚本 / .eslintrc.cjs 从未被 CI 执行，等于不设防。
      - name: 代码规范检查（ESLint）
        working-directory: frontend
        run: npm run lint
      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck
      - name: 构建
        working-directory: frontend
        run: npm run build

  images:
    name: 容器镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -f deploy/backend.Dockerfile -t campus-overflow-backend:${{ github.sha }} .
      - name: 构建前端镜像
        run: docker build -f deploy/frontend.Dockerfile -t campus-overflow-web:${{ github.sha }} .

  # SonarQube 质量门禁（Issue #32）。
  # 在 runner 内临时起一个 sonarqube 容器，跑完即弃；不依赖外部 Sonar 服务器。
  # 质量门禁阈值（Coverage>70% / Bugs=0 / Vuln=0 / Code Smells<5）在 SonarQube
  # 后台 Quality Gate 里配置；-Dsonar.qualitygate.wait=true 会让 mvn 命令阻塞到
  # 门禁出结果，不通过则 job fail，PR 自动标红。
  # SONAR_TOKEN 未配置时 job 自动跳过（不卡 PR），由管理员配好 secret 后自动启用。
  sonar:
    name: SonarQube 质量门禁
    runs-on: ubuntu-latest
    needs: [backend]
    if: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Sonar 需要完整 git 历史计算 new code 分支

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: 启动 SonarQube 容器
        run: |
          docker run -d --name sonarqube \
            -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            -e SONAR_WEB_JAVAOPTS="-Xmx1024m -Xms256m" \
            sonarqube:10.7.0-community

      - name: 等待 SonarQube 就绪
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/api/system/status | grep -q '"status":"UP"'; then
              echo "SonarQube is UP"
              exit 0
            fi
            echo "waiting... ($i/60)"
            sleep 5
          done
          echo "::error::SonarQube did not become ready in 5 minutes"
          exit 1

      - name: 跑测试并生成 JaCoCo 报告
        run: mvn -B -f backend/pom.xml test jacoco:report

      - name: Sonar 扫描并等待质量门禁
        run: |
          mvn -B -f backend/pom.xml sonar:sonar \
            -Dsonar.projectKey=campus-overflow \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.java.coveragePlugin=jacoco
