# 骨架绿灯流水线：只验证"结构没坏"，不跑 TODO 测试
# 与 ci.yml 的分工：ci.yml 是全量验证（#72 合并后已全绿），本流水线是日常门禁（必须绿）
# 两条流水线的前端 job 都必须真跑 ESLint，详见 #42。
name: skeleton-check

on:
  # 不限制 base 分支：所有 PR 都触发，避免 stacked PR 等不到检查而锁死合并
  pull_request:
  push:
    # develop 是集成分支，直接推送也要过这套日常门禁；此前只挂 main，
    # 等于 develop 上只有 ci.yml 兜底，本流水线的骨架/前端检查会被绕过。
    branches: [main, develop]

jobs:
  backend-skeleton:
    name: skeleton-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: 安装全部模块（跳过测试，仅让兄弟模块可被解析）
        run: mvn -B -f backend/pom.xml -DskipTests install

      - name: 架构约束检查（ArchUnit）
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap -Dtest=ArchitectureTest -DfailIfNoTests=false

      - name: 参考实现测试（Identity + Shared Kernel，必须绿）
        run: mvn -B -f backend/pom.xml test -pl co-identity/co-identity-domain,co-shared-kernel -DfailIfNoTests=false

  frontend-check:
    name: frontend-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        working-directory: frontend
        run: npm install --no-audit --no-fund
      # #42：与 ci.yml 的「前端构建」保持同样的门禁强度，
      # PR 上两条都必须真跑 ESLint，不允许只 typecheck + build 就放行。
      - name: 代码规范检查（ESLint）
        working-directory: frontend
        run: npm run lint
      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck
      - name: 构建
        working-directory: frontend
        run: npm run build
