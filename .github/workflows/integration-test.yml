# Lab7 / #34：Testcontainers 集成测试必须在带 Docker 的 runner 上真实运行。
# 与 ci.yml 的阶段 4（ADR-009 的 continue-on-error 过渡配置）分开：
# 这里是阻断性门禁，一旦 IT 失败就让 PR 变红，不允许「代码存在但从未跑过」。
name: Testcontainers 集成测试 (Lab7)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: MySQL 8 + Redis 7 全链路
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: 确认 runner 提供 Docker 守护进程
        run: docker version --format 'Docker Server {{.Server.Version}}'

      - name: 运行 Testcontainers 集成测试
        # -Djacoco.skip=true：覆盖率门禁由 ci.yml（PR #75）负责，本作业只关注 IT 是否真跑通
        # -pl co-bootstrap -am：带上所有上游模块，确保 Flyway 迁移资源一并打包
        run: |
          mvn -B -f backend/pom.xml verify -pl co-bootstrap -am -Djacoco.skip=true

      - name: 汇总 IT 结果
        if: always()
        run: |
          found=0
          for f in backend/co-bootstrap/target/failsafe-reports/*.txt; do
            [ -f "$f" ] || continue
            found=1
            echo "--- $f"
            grep -E "Tests run:" "$f" || true
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::未生成任何 failsafe 报告，集成测试没有真正执行"
            exit 1
          fi

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            backend/**/target/failsafe-reports/**
            backend/**/target/surefire-reports/**
