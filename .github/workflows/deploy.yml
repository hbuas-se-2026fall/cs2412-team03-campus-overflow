# Lab8 / Issue #38：部署流水线
#
# 设计取舍：课程仓库没有长期在线的部署主机，Secrets 也不该由代码代填。
# 因此默认只在手动触发时运行，且：
#   - verify-config 任务永远可跑（不需要任何 Secret），为 Lab8 提供真实的 CI 证据；
#   - deploy 任务在缺少 Secrets 时「安全跳过」并给出 ::notice::，不会把 CI 变红；
#   - 不引入任何第三方 Action，只用 runner 自带的 ssh / scp / docker CLI。
#
# 配好 Secrets 后才会真正部署：DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PATH
# 详见 docs/ops/runbook.md 的「自动部署」小节。

name: Deploy (Lab8)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "要部署的镜像 tag（留空则用当前 commit SHA）"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify-config:
    name: 部署配置校验（无需 Secrets）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 可观测性与 compose 配置校验
        run: node scripts/verify-observability.mjs

  deploy:
    name: 部署到目标主机
    runs-on: ubuntu-latest
    needs: [verify-config]
    env:
      SSH_HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查部署凭据（未配置则安全跳过）
        id: gate
        run: |
          missing=""
          for v in SSH_HOST SSH_USER SSH_KEY DEPLOY_PATH; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::notice title=部署已跳过::未配置 Secrets:$missing ；配置校验已通过，本次不执行实际部署"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备 SSH 密钥
        if: steps.gate.outputs.enabled == 'true'
        run: |
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: 同步部署文件与环境变量
        if: steps.gate.outputs.enabled == 'true'
        run: |
          # shellcheck disable=SC2086
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH/deploy'"
          # shellcheck disable=SC2086
          scp $SSH_OPTS -r deploy/. "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/deploy/"
          # .env 含密码，只由目标主机上的既有文件提供，绝不从 Actions 日志或仓库写入

      - name: 拉取镜像并滚动更新
        if: steps.gate.outputs.enabled == 'true'
        run: |
          # 变量经命令前缀显式传入远端；heredoc 用单引号防止 runner 侧提前展开
          # shellcheck disable=SC2086
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          export BACKEND_IMAGE="${BACKEND_IMAGE:-campus-overflow-backend:$IMAGE_TAG}"
          export WEB_IMAGE="${WEB_IMAGE:-campus-overflow-web:$IMAGE_TAG}"
          docker compose -f deploy/docker-compose.yml --profile observability pull backend web || true
          docker compose -f deploy/docker-compose.yml --profile observability up -d --no-build
          docker compose -f deploy/docker-compose.yml --profile observability ps
          REMOTE

      - name: 部署后健康检查
        if: steps.gate.outputs.enabled == 'true'
        run: |
          # shellcheck disable=SC2086
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "backend health: UP"
              exit 0
            fi
            sleep 5
          done
          echo "::error::部署后 150s 内后端健康检查仍未通过"
          exit 1
          REMOTE
