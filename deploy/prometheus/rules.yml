# Lab8 / Issue #39 告警规则
#
# 指标来源（均为仓库内已实现、真实暴露的指标，不依赖未落地的埋点）：
#   http_server_requests_seconds_*  Spring Boot Actuator + Micrometer（co-bootstrap/pom.xml）
#   jvm_memory_used_bytes           Micrometer JVM binder
#   hikaricp_connections_*          Micrometer Hikari binder
#   co_outbox_backlog               OutboxRelay.java:70
#   co_outbox_dead_letters          OutboxRelay.java:71
#   co_reputation_mismatches        ReputationJobs.java:26
#   up                              Prometheus 自身抓取状态
#
# application="campus-overflow" 来自 application.yml 的 management.metrics.tags。
# 本文件由 deploy/prometheus.yml 的 rule_files 加载，并由 deploy/docker-compose.yml 挂载。
# 结构校验：node scripts/verify-observability.mjs

groups:
  - name: campus-overflow-slo
    interval: 30s
    rules:
      # 1) SLO：5xx 错误率 > 1%，持续 5 分钟
      - alert: HighHttpErrorRate
        expr: >-
          sum(rate(http_server_requests_seconds_count{application="campus-overflow",status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count{application="campus-overflow"}[5m])), 0.001) > 0.01
        for: 5m
        labels:
          severity: warning
          team: campus-overflow
          slo: availability
        annotations:
          summary: "5xx 错误率超过 1%"
          description: "近 5 分钟 5xx 占比 {{ $value | humanizePercentage }}，超过 1% 阈值。先查 /actuator/health 与后端日志，再对照 QS-01 详情页链路。"

      # 2) SLO：P95 响应时间 > 500ms，持续 10 分钟
      - alert: HighP95Latency
        expr: >-
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application="campus-overflow"}[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
          team: campus-overflow
          slo: latency
        annotations:
          summary: "HTTP P95 延迟超过 500ms"
          description: "近 5 分钟 P95 = {{ $value | humanizeDuration }}。重点关注 /api/v1/questions/{questionId}（QS-01 要求 ≤300ms）。"

      - alert: ServiceDown
        expr: up{job="campus-overflow"} == 0
        for: 2m
        labels:
          severity: critical
          team: campus-overflow
        annotations:
          summary: "后端实例不可达"
          description: "Prometheus 连续 2 分钟抓不到 /actuator/prometheus。按运维手册「后端起不来」章节处置。"

  - name: campus-overflow-domain
    interval: 30s
    rules:
      # 3) 事务性发件箱积压：ADR-002
      - alert: OutboxBacklog
        expr: co_outbox_backlog{application="campus-overflow"} > 100
        for: 5m
        labels:
          severity: warning
          team: campus-overflow
        annotations:
          summary: "发件箱积压超过 100 条"
          description: "OutboxRelay 消费跟不上生产，当前积压 {{ $value }} 条。检查 relay 线程与下游事件处理耗时。"

      # 4) 死信：>0 即需人工介入（不能自动忽略）
      - alert: OutboxDeadLetters
        expr: co_outbox_dead_letters{application="campus-overflow"} > 0
        for: 1m
        labels:
          severity: critical
          team: campus-overflow
        annotations:
          summary: "出现发件箱死信事件"
          description: "已有 {{ $value }} 条事件超过最大重试次数，需人工核查原因、清零 attempts 后重放。"

      # 5) 声誉对账不一致（FF-8，应恒为 0）
      - alert: ReputationMismatch
        expr: co_reputation_mismatches{application="campus-overflow"} > 0
        for: 5m
        labels:
          severity: critical
          team: campus-overflow
        annotations:
          summary: "声誉账本对账不一致"
          description: "对账发现 {{ $value }} 个账户余额与账本流水不符，属数据一致性问题，按 ADR-004 处置。"

      # 6) JVM 老年代/堆水位保护
      - alert: JvmHeapNearLimit
        expr: >-
          sum(jvm_memory_used_bytes{application="campus-overflow",area="heap"})
          / sum(jvm_memory_max_bytes{application="campus-overflow",area="heap"}) > 0.85
        for: 10m
        labels:
          severity: warning
          team: campus-overflow
        annotations:
          summary: "JVM 堆使用率超过 85%"
          description: "堆水位 {{ $value | humanizePercentage }} 持续 10 分钟。先看 GC pause 与 Hikari 活跃连接，再决定是否调 -XX:MaxRAMPercentage。"
