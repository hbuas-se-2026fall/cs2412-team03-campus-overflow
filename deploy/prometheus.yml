# Lab8 / Issue #39：Prometheus 采集与告警规则加载
# 由 deploy/docker-compose.yml 挂载到 /etc/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 30s

# 规则文件与 prometheus.yml 一起挂载（见 docker-compose.yml 的 prometheus.volumes）
rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: campus-overflow
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

# 说明（Issue #39「告警发到团队群」的当前边界，不虚报已完成）：
#   告警规则已在 rules.yml 定义并会由 Prometheus 评估，可在 http://localhost:9090/alerts 直接查看。
#   要把告警推送到企业微信群/钉钉，需再接入 Alertmanager 并在其 route/receiver 里配置群机器人
#   webhook（属于团队密钥，不入库）。接入时在此处补：
#     alerting:
#       alertmanagers:
#         - static_configs:
#             - targets: ["alertmanager:9093"]
#   并在 docker-compose.yml 增加 alertmanager 服务与 ALERTMANAGER_WEBHOOK_URL 环境变量。
#
# 建议在 Grafana 中关注的自定义指标（均已与 rules.yml 对齐）：
#   co_outbox_backlog        发件箱积压（>100 持续 5 分钟告警）
#   co_outbox_dead_letters   死信事件数（>0 即需人工介入）
#   co_reputation_mismatches 声誉对账不一致账户数（FF-8，应恒为 0）
#   http_server_requests_seconds{uri="/api/v1/questions/{questionId}"}  详情页 P95（QS-01 ≤ 300ms）
