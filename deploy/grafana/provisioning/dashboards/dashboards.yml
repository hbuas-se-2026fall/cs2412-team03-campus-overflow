# Grafana 自动加载看板（Lab8 / Issue #39）
apiVersion: 1

providers:
  - name: campus-overflow
    orgId: 1
    folder: CampusOverflow
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
